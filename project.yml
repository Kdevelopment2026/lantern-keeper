name: LanternKeeper
options:
  bundleIdPrefix: com.kayode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SJW465977U
targets:
  LanternKeeper:
    type: application
    platform: iOS
    sources:
      - path: LanternKeeper
        excludes:
          - "SupportingFiles/Info.plist"
    info:
      path: LanternKeeper/SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Lantern Keeper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.lanternkeeper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - LanternKeeperTests
        - LanternKeeperUITests
      gatherCoverageData: false
  LanternKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LanternKeeperTests
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - target: LanternKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.lanternkeeper.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LanternKeeper.app/LanternKeeper"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LanternKeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LanternKeeperUITests
    dependencies:
      - target: LanternKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.lanternkeeper.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LanternKeeper
